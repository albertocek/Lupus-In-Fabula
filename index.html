<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Lupus in Fabula</title>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden font-sans">
    
    <!-- Contenitore Mobile-First: max-w-md blocca la larghezza a quella di uno smartphone, mx-auto lo centra su schermi grandi -->
    <div id="app" class="max-w-md mx-auto h-full flex flex-col bg-gray-900 shadow-2xl">

        <!-- HEADER: Fisso in alto -->
        <header class="py-6 text-center border-b border-gray-800">
            <div class="flex items-center justify-between px-2">
                <!-- SINISTRA: Tasto Indietro con SVG vettoriale -->
                <button @click="tornaInserimentoGiocatori"
                :class="{ 'invisible': fase !== 'sceltaRuoli' }"
                class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </button>
                <h1 class="text-3xl font-bold text-red-600 tracking-wider text-center">LUPUS</h1>
                <div class="w-12 h-12">
            <!-- Inserirai qui il tuo futuro bottone -->
                </div>
            </div>
            <p v-if="fase === 'inserimentoGiocatori'" class="text-gray-400 text-sm mt-1">Inserire i giocatori</p>
            <p v-if="fase === 'sceltaRuoli'" class="text-gray-400 text-sm mt-1">Scegliere quali ruoli inserire nella partita</p>
        </header>

        <!-- MAIN: Area flessibile che prende lo spazio rimanente (flex-1) e permette lo scroll (overflow-y-auto) -->
        <main class="flex-1 overflow-y-auto p-5">
            <!-- FASE 1: Inserimento giocatori -->
            <div v-if="fase === 'inserimentoGiocatori'">
                <!-- ZONA INPUT -->
                <div class="flex mb-4 shadow-lg">
                    <input type="text" 
                    v-model="nuovoGiocatore" 
                    placeholder="Nome giocatore..."
                    class="flex-1 bg-gray-800 text-white px-4 py-3 rounded-l-xl border border-gray-700 focus:outline-none focus:border-red-500">
                    <button @click="aggiungiGiocatore"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-r-xl transition-colors">
                        Aggiungi
                    </button>
                </div>

                <button @click="sceltaRuoli"
                    class="w-full mb-12 bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-colors shadow-lg"
                    :disabled="giocatori.length < 3">
                    Scegli Ruoli
                </button>

                <!-- ZONA LISTA -->
                <ul class="space-y-3">
                    <li v-for="(giocatore, index) in giocatori" 
                    class="flex justify-between items-center bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-sm">
                        <span class="font-bold text-lg text-gray-100">{{ giocatore.nome }}</span>
                        
                        <button @click="rimuoviGiocatore(index)"
                        class="text-gray-500 hover:text-red-500 font-bold p-2 transition-colors">
                        ✕
                        </button>
                    </li>
                </ul>
            </div>
            <div v-if="fase === 'sceltaRuoli'">
                    <!-- Contenitore della lista: diamo molto spazio verticale tra i ruoli per ospitare i bottoni sporgenti -->
                <ul class="space-y-10 mt-4 pb-10">
                    
                    <!-- IL SINGOLO RUOLO -->
                    <li v-for="(quantita, ruolo) in ruoliSpeciali" :key="ruolo" class="w-full flex flex-col items-center bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-md">
                        
                        <!-- Nome del ruolo (con prima lettera maiuscola) -->
                        <h3 class="text-xl font-bold text-gray-100 mb-5 capitalize">{{ ruolo }}</h3>

                        <!-- GABBIA SPAZIALE: 'relative' dice al browser "calcola le coordinate assolute partendo da questo esatto perimetro" -->
                        <div class="relative">
                            
                            <!-- AVATAR / FOTO (Il Cerchio Base) -->
                            <div class="w-32 h-32 bg-gray-700 rounded-full border-4 border-gray-600 flex items-center justify-center overflow-hidden">
                                <!-- Segnaposto: qui un domani inserirai il tag <img src="..."> -->
                                <span class="text-gray-500 font-semibold text-sm">FOTO</span>
                            </div>

                            <!-- CONTROLLI SOVRAPPOSTI: 'absolute' lo sgancia dal flusso della pagina. 
                                -bottom-4 lo spinge giù fuori dal cerchio.
                                left-1/2 e -translate-x-1/2 lo centrano matematicamente sull'asse orizzontale. -->
                            <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 flex items-center gap-3 bg-gray-900 p-1.5 rounded-full border border-gray-700 shadow-xl">
                                
                                <!-- Tasto Meno -->
                                <button @click="decrementaRuolo(ruolo)"
                                :disabled="ruoliSpeciali[ruolo] === 0" 
                                class="w-10 h-10 rounded-full bg-gray-700 hover:bg-red-600 text-white text-xl font-bold flex items-center justify-center transition-colors">
                                    -
                                </button>
                                
                                <!-- Contatore -->
                                <span class="w-6 text-center font-bold text-white text-lg">
                                    {{ quantita }}
                                </span>
                                
                                <!-- Tasto Più -->
                                <button @click="incrementaRuolo(ruolo)"
                                class="w-10 h-10 rounded-full bg-gray-700 hover:bg-red-600 text-white text-xl font-bold flex items-center justify-center transition-colors">
                                    +
                                </button>

                            </div>
                        </div>
                        
                    </li>
                </ul>
                <button @click="cominciaPartita()"
                    class="w-full mb-12 bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-colors shadow-lg"
                    :disabled="ruoliSpeciali['lupo'] < 1">
                    Comincia la partita
                </button>
            </div>
            <div v-if="fase === 'loopRivelazioneRuoli'" class="flex flex-col items-center justify-center min-h-[60vh] select-none">

                <!-- Schermo Superiore -->
                <div class="h-48 flex flex-col justify-center items-center text-center px-4">
                    <template v-if="!ruoloVisibile">
                        <h2 class="text-3xl font-bold text-white mb-2">Passa il telefono a:</h2>
                        <h1 class="text-5xl font-black text-red-600">{{ giocatori[indiceGiocatoreAttuale].nome }}</h1>
                    </template>
                    
                    <template v-else>
                        <h2 class="text-2xl font-bold text-gray-400 mb-2">{{ giocatori[indiceGiocatoreAttuale].nome }}, il tuo ruolo è:</h2>
                        <h1 class="text-5xl font-black text-white">{{ giocatori[indiceGiocatoreAttuale].ruolo }}</h1>
                    </template>
                </div>

                <!-- Pad Inferiore Rotondo -->
                <button
                    @touchstart.prevent="ruoloVisibile = true"
                    @mousedown.prevent="ruoloVisibile = true"
                    @touchend.prevent="passaAlProssimo"
                    @mouseup.prevent="passaAlProssimo"
                    @mouseleave.prevent="passaAlProssimo"
                    :class="ruoloVisibile ? 'bg-red-600 shadow-[0_0_50px_rgba(220,38,38,0.4)] border-red-500' : 'bg-gray-800 border-gray-600 border-dashed'"
                    class="w-48 h-48 mt-12 rounded-full text-2xl font-bold text-white border-4 transition-all duration-75 flex flex-col items-center justify-center"
                >
                    <span>{{ ruoloVisibile ? 'RILASCIA' : 'PREMI' }}</span>
                </button>

            </div>
        </main>
    </div>

    <!-- Script logico -->
    <script src="app.js"></script>
</body>
</html>
